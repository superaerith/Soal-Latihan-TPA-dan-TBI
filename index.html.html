<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TPA & TBI Sekolah Kedinasan</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
  min-height: 100vh;
  color: #e2e8f0;
  padding: 20px;
  line-height: 1.6;
}
.container { max-width: 900px; margin: 0 auto; }

/* HEADER */
header {
  text-align: center;
  margin-bottom: 30px;
  padding: 30px 20px;
  background: linear-gradient(135deg, rgba(99,102,241,0.15) 0%, rgba(168,85,247,0.15) 100%);
  border-radius: 20px;
  border: 1px solid rgba(99,102,241,0.3);
  position: relative;
  overflow: hidden;
}
header::before {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(circle, rgba(99,102,241,0.1) 0%, transparent 70%);
  animation: rotate 20s linear infinite;
}
@keyframes rotate { to { transform: rotate(360deg); } }
header h1 {
  font-family: 'Playfair Display', serif;
  font-size: 2.5em;
  font-weight: 900;
  background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 10px;
  position: relative;
}
header p { color: #94a3b8; font-size: 1.05em; position: relative; }

/* PACKAGE SELECTOR */
.packages {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 15px;
  margin-bottom: 25px;
}
.package-card {
  background: rgba(30,41,59,0.7);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(99,102,241,0.2);
  border-radius: 16px;
  padding: 20px;
  cursor: pointer;
  transition: all 0.3s;
  text-align: center;
}
.package-card:hover {
  transform: translateY(-3px);
  border-color: #6366f1;
  box-shadow: 0 10px 30px rgba(99,102,241,0.3);
}
.package-card.active {
  background: linear-gradient(135deg, rgba(99,102,241,0.25), rgba(168,85,247,0.25));
  border-color: #a855f7;
  box-shadow: 0 0 20px rgba(168,85,247,0.4);
}
.package-card h3 { color: #fff; font-size: 1.1em; margin-bottom: 5px; }
.package-card .badge { color: #94a3b8; font-size: 0.85em; }

/* TYPE SELECTOR */
.type-selector {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  background: rgba(30,41,59,0.5);
  padding: 6px;
  border-radius: 12px;
}
.type-btn {
  flex: 1;
  padding: 12px;
  background: transparent;
  border: none;
  border-radius: 8px;
  color: #94a3b8;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  font-family: inherit;
  font-size: 1em;
}
.type-btn.active {
  background: linear-gradient(135deg, #6366f1, #a855f7);
  color: #fff;
}

/* PROGRESS */
.progress-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
  padding: 12px 18px;
  background: rgba(30,41,59,0.5);
  border-radius: 10px;
  font-size: 0.9em;
}
.progress-bar {
  height: 6px;
  background: rgba(99,102,241,0.1);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 20px;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
  border-radius: 3px;
  transition: width 0.4s;
}
.score-badge {
  background: linear-gradient(135deg, #10b981, #059669);
  padding: 4px 10px;
  border-radius: 6px;
  font-weight: 600;
  color: #fff;
}

/* QUESTION CARD */
.question-card {
  background: rgba(30,41,59,0.7);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(99,102,241,0.2);
  border-radius: 16px;
  padding: 25px;
  margin-bottom: 20px;
  animation: slideIn 0.4s ease-out;
}
@keyframes slideIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
.question-num { color: #a855f7; font-weight: 700; margin-bottom: 10px; font-size: 0.9em; letter-spacing: 1px; }
.question-text { font-size: 1.1em; margin-bottom: 20px; color: #f1f5f9; line-height: 1.7; }

.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 16px;
  background: rgba(15,23,42,0.6);
  border: 1px solid rgba(99,102,241,0.2);
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  font-size: 1em;
  color: #e2e8f0;
  text-align: left;
  width: 100%;
}
.option:hover:not(:disabled) {
  background: rgba(99,102,241,0.1);
  border-color: #6366f1;
  transform: translateX(3px);
}
.option:disabled { cursor: not-allowed; }
.option-letter {
  background: rgba(99,102,241,0.2);
  border: 1px solid rgba(99,102,241,0.4);
  width: 28px;
  height: 28px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  flex-shrink: 0;
  color: #a855f7;
}
.option.correct {
  background: rgba(16,185,129,0.15);
  border-color: #10b981;
}
.option.correct .option-letter { background: #10b981; color: #fff; border-color: #10b981; }
.option.wrong {
  background: rgba(239,68,68,0.15);
  border-color: #ef4444;
}
.option.wrong .option-letter { background: #ef4444; color: #fff; border-color: #ef4444; }

/* CONTROLS */
.controls {
  display: flex;
  gap: 10px;
  margin-top: 20px;
  flex-wrap: wrap;
}
.btn {
  padding: 12px 20px;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  font-size: 0.95em;
  flex: 1;
  min-width: 120px;
}
.btn-primary {
  background: linear-gradient(135deg, #6366f1, #a855f7);
  color: #fff;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(99,102,241,0.4); }
.btn-secondary {
  background: rgba(99,102,241,0.15);
  color: #a855f7;
  border: 1px solid rgba(99,102,241,0.3);
}
.btn-secondary:hover { background: rgba(99,102,241,0.25); }
.btn-warning {
  background: linear-gradient(135deg, #f59e0b, #f97316);
  color: #fff;
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* DISCUSSION */
.discussion {
  margin-top: 18px;
  padding: 18px;
  background: linear-gradient(135deg, rgba(16,185,129,0.1), rgba(99,102,241,0.1));
  border-left: 4px solid #10b981;
  border-radius: 10px;
  animation: fadeIn 0.4s;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.discussion-title {
  font-weight: 700;
  color: #10b981;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.discussion-text { color: #cbd5e1; line-height: 1.7; }

/* NAVIGATION */
.nav-controls {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

/* JUMP NAVIGATOR */
.jump-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 15px;
  padding: 15px;
  background: rgba(30,41,59,0.5);
  border-radius: 10px;
  max-height: 200px;
  overflow-y: auto;
}
.jump-num {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(99,102,241,0.15);
  border: 1px solid rgba(99,102,241,0.3);
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.85em;
  color: #cbd5e1;
  font-weight: 600;
  transition: all 0.2s;
}
.jump-num:hover { background: rgba(99,102,241,0.3); transform: scale(1.05); }
.jump-num.current { background: linear-gradient(135deg, #6366f1, #a855f7); color: #fff; }
.jump-num.answered.correct { background: rgba(16,185,129,0.3); border-color: #10b981; }
.jump-num.answered.wrong { background: rgba(239,68,68,0.3); border-color: #ef4444; }

/* RESULT */
.result-card {
  text-align: center;
  padding: 40px 20px;
  background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(99,102,241,0.15));
  border: 1px solid rgba(16,185,129,0.3);
  border-radius: 20px;
}
.result-score {
  font-size: 4em;
  font-weight: 900;
  background: linear-gradient(135deg, #10b981, #6366f1);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin: 15px 0;
  font-family: 'Playfair Display', serif;
}
.result-text { color: #94a3b8; font-size: 1.1em; }

@media (max-width: 600px) {
  body { padding: 12px; }
  header { padding: 20px 15px; }
  header h1 { font-size: 1.8em; }
  .question-card { padding: 18px; }
  .question-text { font-size: 1em; }
  .btn { font-size: 0.9em; padding: 10px 14px; }
}
</style>
</head>

<script>
let currentPackage = 'paket1';
let currentType = 'tpa';
let currentIdx = 0;
let answers = {}; // { 'paket1-tpa-0': {selected, correct} }

const packageDiv = document.getElementById('packages');
const typeBtns = document.querySelectorAll('.type-btn');
const quizContent = document.getElementById('quizContent');
const progressText = document.getElementById('progressText');
const progressFill = document.getElementById('progressFill');
const scoreText = document.getElementById('scoreText');
const jumpNav = document.getElementById('jumpNav');

// Render package cards
function renderPackages() {
  packageDiv.innerHTML = '';
  Object.keys(soalDatabase).forEach(key => {
    const pkg = soalDatabase[key];
    const card = document.createElement('div');
    card.className = 'package-card' + (key === currentPackage ? ' active' : '');
    card.innerHTML = `
      <h3>${pkg.nama}</h3>
      <div class="badge">${pkg.tpa.length} TPA · ${pkg.tbi.length} TBI</div>
    `;
    card.onclick = () => {
      currentPackage = key;
      currentIdx = 0;
      renderPackages();
      render();
    };
    packageDiv.appendChild(card);
  });
}

typeBtns.forEach(btn => {
  btn.onclick = () => {
    typeBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentType = btn.dataset.type;
    currentIdx = 0;
    render();
  };
});

function getCurrentSoalArr() {
  return soalDatabase[currentPackage][currentType] || [];
}

function getKey(idx) {
  return `${currentPackage}-${currentType}-${idx}`;
}

function calcScore() {
  const arr = getCurrentSoalArr();
  let correct = 0;
  arr.forEach((_, i) => {
    if (answers[getKey(i)] && answers[getKey(i)].correct) correct++;
  });
  return { correct, total: arr.length };
}

function render() {
  const arr = getCurrentSoalArr();
  if (arr.length === 0) {
    quizContent.innerHTML = '<div class="question-card"><p>Soal sedang dimuat...</p></div>';
    jumpNav.innerHTML = '';
    return;
  }
  
  const s = arr[currentIdx];
  const key = getKey(currentIdx);
  const ans = answers[key];
  
  const opts = ['A', 'B', 'C', 'D'];
  let optionsHtml = s.o.map((opt, i) => {
    let cls = 'option';
    if (ans) {
      if (i === s.a) cls += ' correct';
      else if (i === ans.selected && i !== s.a) cls += ' wrong';
    }
    return `<button class="${cls}" onclick="selectAnswer(${i})" ${ans ? 'disabled' : ''}>
      <span class="option-letter">${opts[i]}</span>
      <span>${opt}</span>
    </button>`;
  }).join('');

  let discussionHtml = '';
  if (ans && ans.showDiscussion) {
    discussionHtml = `
      <div class="discussion">
        <div class="discussion-title">💡 Pembahasan</div>
        <div class="discussion-text">${s.p}</div>
      </div>`;
  }

  let actionBtn = '';
  if (ans && !ans.showDiscussion) {
    actionBtn = `<button class="btn btn-warning" onclick="showDisc()">📖 Lihat Pembahasan</button>`;
  } else if (!ans) {
    actionBtn = `<button class="btn btn-secondary" onclick="showDisc(true)">📖 Lihat Pembahasan</button>`;
  }

  quizContent.innerHTML = `
    <div class="question-card">
      <div class="question-num">SOAL ${currentIdx + 1} / ${arr.length} · ${currentType.toUpperCase()}</div>
      <div class="question-text">${s.q}</div>
      <div class="options">${optionsHtml}</div>
      <div class="controls">
        ${actionBtn}
      </div>
      ${discussionHtml}
      <div class="nav-controls">
        <button class="btn btn-secondary" onclick="prev()" ${currentIdx === 0 ? 'disabled' : ''}>← Sebelumnya</button>
        <button class="btn btn-primary" onclick="next()" ${currentIdx === arr.length - 1 ? 'disabled' : ''}>Selanjutnya →</button>
      </div>
    </div>
  `;
  
  // Progress
  const sc = calcScore();
  progressText.textContent = `Soal ${currentIdx + 1} dari ${arr.length}`;
  scoreText.textContent = `Skor: ${sc.correct}/${sc.total}`;
  progressFill.style.width = ((currentIdx + 1) / arr.length * 100) + '%';
  
  // Jump nav
  renderJump();
}

function renderJump() {
  const arr = getCurrentSoalArr();
  jumpNav.innerHTML = '';
  arr.forEach((_, i) => {
    const k = getKey(i);
    const a = answers[k];
    let cls = 'jump-num';
    if (i === currentIdx) cls += ' current';
    if (a) cls += a.correct ? ' answered correct' : ' answered wrong';
    const btn = document.createElement('button');
    btn.className = cls;
    btn.textContent = i + 1;
    btn.onclick = () => { currentIdx = i; render(); };
    jumpNav.appendChild(btn);
  });
}

function selectAnswer(idx) {
  const arr = getCurrentSoalArr();
  const s = arr[currentIdx];
  const key = getKey(currentIdx);
  if (answers[key]) return;
  answers[key] = { selected: idx, correct: idx === s.a, showDiscussion: false };
  render();
}

function showDisc(beforeAnswer) {
  const key = getKey(currentIdx);
  if (!answers[key]) {
    answers[key] = { selected: -1, correct: false, showDiscussion: true };
  } else {
    answers[key].showDiscussion = true;
  }
  render();
}

function next() {
  const arr = getCurrentSoalArr();
  if (currentIdx < arr.length - 1) { currentIdx++; render(); }
}
function prev() {
  if (currentIdx > 0) { currentIdx--; render(); }
}

renderPackages();
render();
</script>
